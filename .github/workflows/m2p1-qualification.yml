name: M2.1 live adapter qualification (offline tests)

on:
  push:
    branches: [feat/v2-m2p1-live-extraction-qualification]
  pull_request:
    paths:
      - 'deepresearch_v2/**'
      - 'tests/**'
      - 'requirements-m2p1.txt'
      - '.github/workflows/m2p1-qualification.yml'
  workflow_dispatch:

jobs:
  offline-qualification:
    name: provider contract / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install headless graph, retrieval and Ollama adapter packages
        run: python -m pip install -r requirements-m2p1.txt
      - name: Verify provider/structured-model adapter import contracts (no API calls)
        run: |
          python -c "from tavily import TavilyClient; from langchain_ollama import ChatOllama; from deepresearch_v2.live import LangChainExtractor; LangChainExtractor(provider='ollama', model='qwen2.5:7b'); print('Provider and structured model adapter import contracts OK')"
      - name: Run regression and mocked provider qualification with actual LangGraph
        run: python -m pytest -q tests/test_m1.py tests/test_headless.py tests/test_public_benchmark.py tests/test_qualification.py
      - name: Generate oracle capture and validate replay byte equality
        shell: bash
        run: |
          python -m deepresearch_v2.qualification oracle-fixture --engine graph --output-dir "$RUNNER_TEMP/oracle"
          python -m deepresearch_v2.qualification replay --engine graph --run-dir "$RUNNER_TEMP/oracle" --output-dir "$RUNNER_TEMP/replay"
          cmp "$RUNNER_TEMP/oracle/report.json" "$RUNNER_TEMP/replay/report.json"
          cmp "$RUNNER_TEMP/oracle/report.md" "$RUNNER_TEMP/replay/report.md"
      - name: Upload unreviewed oracle artifacts (no API secrets)
        uses: actions/upload-artifact@v4
        with:
          name: m2p1-oracle-python-${{ matrix.python-version }}
          path: ${{ runner.temp }}/oracle/
