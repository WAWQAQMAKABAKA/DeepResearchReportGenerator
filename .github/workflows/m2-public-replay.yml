name: M2 public-source excerpt replay

on:
  push:
    branches: [feat/v2-m1-evidence-linked-comparison]
    paths:
      - 'deepresearch_v2/**'
      - 'fixtures/**'
      - 'tests/**'
      - 'requirements-m1.txt'
      - '.github/workflows/m2-public-replay.yml'
  pull_request:
    paths:
      - 'deepresearch_v2/**'
      - 'fixtures/**'
      - 'tests/**'
      - 'requirements-m1.txt'
      - '.github/workflows/m2-public-replay.yml'
  workflow_dispatch:

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install headless dependencies
        run: python -m pip install -r requirements-m1.txt
      - name: Validate real company excerpt replay and prior regression suite
        run: python -m pytest -q tests/test_m1.py tests/test_headless.py tests/test_public_benchmark.py
      - name: Replay public company sources twice via actual LangGraph
        shell: bash
        run: |
          python -m deepresearch_v2.public_benchmark --engine graph --output-dir "$RUNNER_TEMP/m2-first"
          python -m deepresearch_v2.public_benchmark --engine graph --output-dir "$RUNNER_TEMP/m2-second"
          cmp "$RUNNER_TEMP/m2-first/report.json" "$RUNNER_TEMP/m2-second/report.json"
          cmp "$RUNNER_TEMP/m2-first/report.md" "$RUNNER_TEMP/m2-second/report.md"
          cmp "$RUNNER_TEMP/m2-first/evaluation.json" "$RUNNER_TEMP/m2-second/evaluation.json"
      - name: Archive source-backed experiment results
        uses: actions/upload-artifact@v4
        with:
          name: m2-public-replay-python-${{ matrix.python-version }}
          path: ${{ runner.temp }}/m2-first/
